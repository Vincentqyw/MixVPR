name: VPR_iOS
options:
  bundleIdPrefix: com.anureka
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: V7Y52JS55X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  VPR_iOS:
    type: application
    platform: iOS
    sources:
      - path: VPR_iOS
        excludes: ["Models", "Info.plist"]
      - path: VPR_iOS/Models
        type: folder
        buildPhase: resources
    info:
      path: VPR_iOS/Info.plist
      properties:
        CFBundleDisplayName: PlaceLens
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: PlaceLens recognises places from the live camera feed. Frames never leave the device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anureka.mixvprdemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
