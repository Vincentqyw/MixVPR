name: MixVPRDemo
options:
  bundleIdPrefix: com.anureka
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: V7Y52JS55X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MixVPRDemo:
    type: application
    platform: iOS
    sources:
      - path: MixVPRDemo
        excludes: ["Models", "Info.plist"]
      - path: MixVPRDemo/Models
        type: folder
        buildPhase: resources
    info:
      path: MixVPRDemo/Info.plist
      properties:
        CFBundleDisplayName: MixVPR
        NSCameraUsageDescription: MixVPR runs visual place recognition on the live camera feed.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anureka.mixvprdemo
